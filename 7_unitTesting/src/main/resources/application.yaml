server:
  port: 8080

spring:
  application:
    name: unit-testing-demo

  # H2 Database (Great for development & practice)
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: password

  # JPA & Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update          # Creates/updates tables automatically
    show-sql: true              # Shows SQL queries in console (very useful for learning)
    properties:
      hibernate:
        format_sql: true        # Formats SQL nicely
    open-in-view: false         # Best practice - avoids lazy loading issues

  # H2 Console (Access at http://localhost:8080/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console

# Logging Configuration
logging:
  level:
    com.example.unittesting: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE   # Shows parameter values

